{% extends 'base.html' %}
{% block content %}
<section class="intro">
  <p class="eyebrow">Hululu</p>
  <h1>Our Top 3 New Service Girl</h1>
  <p class="lede">Book Now She is Waiting For You.</p>
</section>

<div class="lesson-grid">
  {% for a in articles %}
  <a class="lesson-card" href="{{ url_for('article', slug=a.slug) }}">
    {% if a.image_url %}
    <img class="lesson-card__img" src="{{ a.image_url }}" alt="{{ a.title }}">
    {% endif %}
    <span class="lesson-card__eyebrow"> Girl {{ loop.index }}</span>
    <h2>{{ a.title }}</h2>
    <p>{{ a.excerpt }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
